[build-system]
requires = ["setuptools==80.9.0", "setuptools-scm"]
build-backend = "setuptools.build_meta"

[project]
name = "nlp-fake-news-classifier"
dynamic = ["version"]
description = "NLP-based fake news classifier with sentiment analysis and topic modeling"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "Sebastian Cáceres-Gelvez" }]
keywords = [
    "nlp",
    "fake-news",
    "classification",
    "sentiment-analysis",
    "topic-modeling",
]

dependencies = [
    "nltk>=3.9,<4.0",
    "pandas>=2.3,<3.0",
    "matplotlib>=3.10,<4.0",
    "spacy>=3.8.7,<4.0",
    "textblob>=0.19,<1.0",
    "vaderSentiment>=3.3,<4.0",
    "transformers>=4.56,<5.0",
    "scikit-learn>=1.7.2,<2.0",
    "gensim>=4.3.3,<5.0",
    "seaborn>=0.13,<1.0",
    "torch>=2.8,<3.0",
    "chardet>=5.2,<6.0",
]

[project.optional-dependencies]
dev = [
    "ipywidgets>=8.0,<9.0",
    "ipykernel>=6.0,<7.0",
    "jupyterlab>=4.0,<5.0",
    "notebook>=7.0,<8.0",
    "ruff>=0.3.0,<1.0",
    "isort>=6.0,<7.0",
    "pytest>=7.0,<8.0",
    "pytest-cov>=4.0,<5.0",
    "mypy>=1.0,<2.0",
]

api = [
    "fastapi>=0.116,<1.0",
    "uvicorn[standard]>=0.35,<1.0",
    "pydantic>=2.11,<3.0",
    "python-multipart>=0.0.6,<1.0",
]

front = ["streamlit>=1.49,<2.0", "requests>=2.32,<3.0", "plotly>=6.3,<7.0"]

all = ["nlp-fake-news-classifier[dev,api,front]"]

[project.urls]
Homepage = "https://github.com/sebastiancg/nlp-fake-news-classifier"
Repository = "https://github.com/sebastiancg/nlp-fake-news-classifier"
Documentation = "https://github.com/sebastiancg/nlp-fake-news-classifier#readme"

[tool.setuptools.packages.find]
where = ["."]
include = [
    "nlp_news_classifier*",
    "nlp_news_classifier_api*",
    "nlp_news_classifier_front*",
]
exclude = ["tests*", "notebooks*", "data*"]

[tool.setuptools.package-data]
nlp_fake_news_classifier = ["*.json", "*.txt", "*.csv"]
nlp_news_classifier_api = ["*.json", "*.txt"]
nlp_news_classifier_front = [
    "*.json",
    "*.txt",
    "*.css",
    "*.html",
    "*.js",
    "*.png",
    "*.ico",
]

[tool.setuptools_scm]
version_scheme = "post-release"
local_scheme = "dirty-tag"
write_to = "nlp_news_classifier/_version.py"

[tool.ruff]
target-version = "py312"
line-length = 90

[tool.ruff.lint]
select = [
    "E",  # pycodestyle errors
    "W",  # pycodestyle warnings
    "F",  # pyflakes
    "I",  # isort
    "B",  # flake8-bugbear
    "C4", # flake8-comprehensions
    "UP", # pyupgrade
]
ignore = [
    "I001", # Import block is un-sorted or un-formatted
]

[tool.mypy]
python_version = "3.12"
check_untyped_defs = true
ignore_missing_imports = true
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
